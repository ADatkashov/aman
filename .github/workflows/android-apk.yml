name: Android APK

# Builds the AMAN Patient APK.
#  * push to main / manual run -> APK attached to the run (Artifacts, 14 days).
#  * manual run with `release: true`, or a pushed tag `v*` -> also published as a
#    GitHub Release (permanent one-tap download link).
# Signing: if the secrets below exist the APK is release-signed, otherwise it is
# signed with the debug key (fine for internal QA, not for the Play Store).
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: false
      api_mode:
        description: "AMAN_API_MODE: demo (synthetic data) or remote"
        type: choice
        options: [demo, remote]
        default: demo
      api_url:
        description: "AMAN_API_URL (used when api_mode=remote)"
        type: string
        required: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Decode keystore and write key.properties
        id: signing
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Signing secrets not set - APK will be debug-signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          cat > app/android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          API_MODE: ${{ inputs.api_mode || 'demo' }}
          API_URL: ${{ inputs.api_url }}
        run: |
          args=(--release --dart-define=AMAN_API_MODE="$API_MODE")
          if [ -n "$API_URL" ]; then args+=(--dart-define=AMAN_API_URL="$API_URL"); fi
          flutter build apk "${args[@]}"

      - name: Name the APK
        id: name
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1 | tr -d '[:space:]')
          out="aman-patient-${v}-${{ github.run_number }}.apk"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/$out"
          echo "file=dist/$out" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aman-patient-apk
          path: ${{ steps.name.outputs.file }}
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('apk-v{0}-{1}', steps.name.outputs.version, github.run_number) }}
          name: AMAN Patient v${{ steps.name.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: ${{ steps.name.outputs.file }}
          body: |
            Android APK from commit `${{ github.sha }}`.
            Signing: ${{ steps.signing.outputs.signed == 'true' && 'release key' || 'debug key (QA only)' }}.

      - name: Remove keystore
        if: always()
        working-directory: .
        run: |
          rm -f app/android/key.properties
          rm -rf "$RUNNER_TEMP/keystore"
