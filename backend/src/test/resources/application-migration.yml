# Runs the real Flyway migrations (incl. demo catalog) and lets Hibernate VALIDATE
# the entity mapping against the migrated schema.
spring:
  datasource:
    url: jdbc:h2:mem:migration;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo

aman:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
  storage:
    dir: ${java.io.tmpdir}/aman-test-documents-migration
